services:

  mqtt-broker:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  mqtt-publisher:
    build:
      context: ./publisher
      dockerfile: Dockerfile
    env_file:
      - ./publisher/.env
    environment:
      MQTT_HOST: mqtt-broker
    depends_on:
      - mqtt-broker
    restart: unless-stopped